<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #000; margin: 0; padding: 20px; }
    canvas { background: #059669; border-radius: 40px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="400"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Scale 4x for 100x100 coord system
    ctx.scale(4, 4);

    // Background gradient (MarkPoint Civic Emerald)
    const grad = ctx.createLinearGradient(0, 0, 100, 100);
    grad.addColorStop(0, '#047857');
    grad.addColorStop(0.4, '#10b981');
    grad.addColorStop(1, '#059669');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 100, 100);

    // Heart Handshake Glyph
    ctx.lineWidth = 7.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#ffffff';

    // Drop shadow for crisp contrast
    ctx.shadowColor = 'rgba(0, 0, 0, 0.16)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 1.5;

    // ----------------------------------------------------
    // 1. LEFT LOBE & LOWER FOREARM
    // ----------------------------------------------------
    ctx.beginPath();
    ctx.moveTo(50, 34);
    // Left lobe
    ctx.bezierCurveTo(36, 18, 18, 22, 16, 38);
    ctx.bezierCurveTo(15, 52, 28, 66, 50, 84);
    // Lower forearm (up-right)
    ctx.lineTo(74, 60);
    ctx.stroke();

    // ----------------------------------------------------
    // 2. FINGER NOTCHES (Lower Hand Fingers)
    // ----------------------------------------------------
    // Lower finger stub
    ctx.beginPath();
    ctx.moveTo(57, 77);
    ctx.lineTo(51, 71);
    ctx.stroke();

    // Upper finger stub
    ctx.beginPath();
    ctx.moveTo(65, 69);
    ctx.lineTo(59, 63);
    ctx.stroke();

    // ----------------------------------------------------
    // 3. RIGHT LOBE & UPPER HAND CLASP (Smooth 20° angled grasp)
    // ----------------------------------------------------
    ctx.beginPath();
    ctx.moveTo(50, 34);
    // Right lobe
    ctx.bezierCurveTo(64, 18, 82, 22, 84, 38);
    // Outer right curve transitioning into upper hand
    ctx.bezierCurveTo(85, 46, 75, 44, 62, 43);
    // Angled clasp sweeping down-left
    ctx.lineTo(46, 47);
    // Smooth 180° loop around the hand/thumb
    ctx.bezierCurveTo(38, 49, 39, 58, 47, 58);
    // Returns down-right parallel to fingers
    ctx.lineTo(66, 54);
    ctx.stroke();

    const dataUrl = canvas.toDataURL('image/png');
    const pre = document.createElement('pre');
    pre.id = 'img-data';
    pre.textContent = dataUrl;
    document.body.appendChild(pre);
  </script>
</body>
</html>
