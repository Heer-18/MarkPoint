<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
    .box { text-align: center; }
    canvas { border: 1px solid #444; background: #059669; }
  </style>
</head>
<body>
  <div class="box">
    <h3>Original Reference</h3>
    <img src="file:///C:/Users/N/.gemini/antigravity-ide/brain/0781c2a2-1082-414f-ae94-eb5bcd5ddbe5/.user_uploaded/media_1789900093169.jpg" width="200" height="200" style="object-fit: contain; background: #ea580c; border-radius: 40px; padding: 10px;">
  </div>
  <div class="box">
    <h3>Canvas Render Test</h3>
    <canvas id="c" width="220" height="220"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    // Scale 2.2x for 100x100 grid
    ctx.scale(2.2, 2.2);
    
    // Rounded container
    ctx.fillStyle = '#059669';
    ctx.fillRect(0, 0, 100, 100);

    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#ffffff';

    // Let's trace the two continuous paths of the reference icon:
    // PATH A: The Left Arm & Top Grasping Hand
    // In reference:
    // Left diagonal starts at bottom apex (50, 78)
    // Goes up-left to (22, 50)
    // Arcs around top-left lobe: (22, 50) -> (24, 32) -> (36, 24) -> (48, 30) -> (50, 36)
    // From cleft (50, 36), the top hand arches up-right: (60, 30) -> (72, 34) -> (74, 44)
    // Loops down & left around the wrist/thumb: (74, 44) -> (70, 50) -> (56, 48) -> (46, 44) (smooth hook)
    
    // Let's draw Path 1:
    ctx.beginPath();
    ctx.moveTo(50, 78);
    ctx.lineTo(24, 52);
    ctx.bezierCurveTo(18, 44, 20, 30, 32, 24);
    ctx.bezierCurveTo(42, 19, 49, 27, 50, 33);
    // Hand grasping over:
    ctx.bezierCurveTo(56, 26, 68, 28, 73, 36);
    ctx.bezierCurveTo(77, 43, 73, 50, 65, 52);
    ctx.bezierCurveTo(57, 54, 48, 48, 44, 43);
    ctx.stroke();

    // PATH B: The Right Arm & Lower Fingers
    // Starts at cleft (50, 33) or right lobe:
    ctx.beginPath();
    ctx.moveTo(68, 54);
    ctx.bezierCurveTo(75, 50, 78, 42, 78, 42); // outer right connection or:
    // In reference, look at the outer right curve:
    // Top right lobe:
    ctx.moveTo(50, 33);
    ctx.bezierCurveTo(51, 33, 58, 25, 68, 26);
    ctx.bezierCurveTo(80, 28, 82, 42, 76, 54);
    ctx.lineTo(50, 78);
    ctx.stroke();

    // Finger 1 (lower):
    ctx.beginPath();
    ctx.moveTo(58, 70);
    ctx.lineTo(52, 64);
    ctx.stroke();

    // Finger 2 (upper):
    ctx.beginPath();
    ctx.moveTo(66, 62);
    ctx.lineTo(60, 56);
    ctx.stroke();

  </script>
</body>
</html>
