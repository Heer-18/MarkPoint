<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MarkPoint Icon Reference Matcher</title>
  <style>
    body { background: #0b1120; color: #fff; font-family: sans-serif; padding: 20px; }
    .grid { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
    .card { background: #1e293b; padding: 16px; border-radius: 16px; text-align: center; }
    canvas { display: block; margin: 10px auto; }
  </style>
</head>
<body>
  <h2>MarkPoint App Icon - Precision Reference Match</h2>
  <div class="grid" id="container"></div>

  <script>
    const SIZES = [
      { name: 'mipmap-mdpi/ic_launcher.png', size: 48, round: false },
      { name: 'mipmap-mdpi/ic_launcher_round.png', size: 48, round: true },
      { name: 'mipmap-mdpi/ic_launcher_foreground.png', size: 108, round: false, fgOnly: true },

      { name: 'mipmap-hdpi/ic_launcher.png', size: 72, round: false },
      { name: 'mipmap-hdpi/ic_launcher_round.png', size: 72, round: true },
      { name: 'mipmap-hdpi/ic_launcher_foreground.png', size: 162, round: false, fgOnly: true },

      { name: 'mipmap-xhdpi/ic_launcher.png', size: 96, round: false },
      { name: 'mipmap-xhdpi/ic_launcher_round.png', size: 96, round: true },
      { name: 'mipmap-xhdpi/ic_launcher_foreground.png', size: 216, round: false, fgOnly: true },

      { name: 'mipmap-xxhdpi/ic_launcher.png', size: 144, round: false },
      { name: 'mipmap-xxhdpi/ic_launcher_round.png', size: 144, round: true },
      { name: 'mipmap-xxhdpi/ic_launcher_foreground.png', size: 324, round: false, fgOnly: true },

      { name: 'mipmap-xxxhdpi/ic_launcher.png', size: 192, round: false },
      { name: 'mipmap-xxxhdpi/ic_launcher_round.png', size: 192, round: true },
      { name: 'mipmap-xxxhdpi/ic_launcher_foreground.png', size: 432, round: false, fgOnly: true },

      { name: 'drawable/splash.png', size: 512, round: false }
    ];

    function drawExactReferenceIcon(ctx, size, isRound, isFgOnly) {
      ctx.clearRect(0, 0, size, size);
      const s = size / 100;
      ctx.save();
      ctx.scale(s, s);

      if (!isFgOnly) {
        // Draw container background for legacy launcher & splash
        ctx.save();
        if (isRound) {
          ctx.beginPath();
          ctx.arc(50, 50, 48, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();
        } else {
          ctx.beginPath();
          ctx.roundRect(4, 4, 92, 92, 22);
          ctx.closePath();
          ctx.clip();
        }

        // Vibrant MarkPoint Emerald Green Gradient
        const grad = ctx.createLinearGradient(0, 0, 100, 100);
        grad.addColorStop(0, '#047857'); // Emerald 700
        grad.addColorStop(0.4, '#10b981'); // Emerald 500
        grad.addColorStop(1, '#059669'); // Emerald 600
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 100, 100);

        // Subtle gradient highlight
        const shine = ctx.createLinearGradient(0, 0, 0, 100);
        shine.addColorStop(0, 'rgba(255, 255, 255, 0.20)');
        shine.addColorStop(0.5, 'rgba(255, 255, 255, 0.0)');
        shine.addColorStop(1, 'rgba(0, 0, 0, 0.10)');
        ctx.fillStyle = shine;
        ctx.fillRect(0, 0, 100, 100);

        ctx.restore();
      }

      // Draw the exact Heart-Handshake glyph
      ctx.save();
      const glyphScale = isFgOnly ? 0.60 : 0.65;
      ctx.translate(50, 50);
      ctx.scale(glyphScale, glyphScale);
      ctx.translate(-50, -50);

      ctx.lineWidth = 7.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#ffffff';

      // Drop shadow for glyph
      ctx.shadowColor = 'rgba(0, 0, 0, 0.16)';
      ctx.shadowBlur = 3;
      ctx.shadowOffsetY = 1.5;

      // ----------------------------------------------------
      // 1. LEFT LOBE & LOWER FOREARM
      // ----------------------------------------------------
      ctx.beginPath();
      ctx.moveTo(50, 34);
      // Left lobe
      ctx.bezierCurveTo(36, 18, 18, 22, 16, 38);
      ctx.bezierCurveTo(15, 52, 28, 66, 50, 84);
      // Lower forearm (up-right)
      ctx.lineTo(74, 60);
      ctx.stroke();

      // ----------------------------------------------------
      // 2. FINGER NOTCHES (Lower Hand Fingers)
      // ----------------------------------------------------
      // Lower finger stub
      ctx.beginPath();
      ctx.moveTo(57, 77);
      ctx.lineTo(51, 71);
      ctx.stroke();

      // Upper finger stub
      ctx.beginPath();
      ctx.moveTo(65, 69);
      ctx.lineTo(59, 63);
      ctx.stroke();

      // ----------------------------------------------------
      // 3. RIGHT LOBE & UPPER HAND CLASP
      // ----------------------------------------------------
      ctx.beginPath();
      ctx.moveTo(50, 34);
      // Right lobe
      ctx.bezierCurveTo(64, 18, 82, 22, 84, 38);
      // Outer right curve transitioning into upper hand
      ctx.bezierCurveTo(85, 46, 75, 44, 62, 43);
      // Angled clasp sweeping down-left
      ctx.lineTo(46, 47);
      // Smooth 180° loop around the hand/thumb
      ctx.bezierCurveTo(38, 49, 39, 58, 47, 58);
      // Returns down-right parallel to fingers
      ctx.lineTo(66, 54);
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    const outputData = {};
    const container = document.getElementById('container');

    SIZES.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      const label = document.createElement('div');
      label.textContent = item.name + ' (' + item.size + 'x' + item.size + ')';
      label.style.fontSize = '12px';

      const canvas = document.createElement('canvas');
      canvas.width = item.size;
      canvas.height = item.size;
      canvas.style.border = '1px solid #475569';
      canvas.style.borderRadius = item.round ? '50%' : '8px';
      if (item.fgOnly) canvas.style.background = '#064e3b';

      const ctx = canvas.getContext('2d');
      drawExactReferenceIcon(ctx, item.size, item.round, item.fgOnly);

      card.appendChild(label);
      card.appendChild(canvas);
      container.appendChild(card);

      outputData[item.name] = canvas.toDataURL('image/png');
    });

    window.MARKPOINT_ICONS = outputData;

    const pre = document.createElement('pre');
    pre.id = 'json-data';
    pre.textContent = JSON.stringify(outputData);
    document.body.appendChild(pre);
  </script>
</body>
</html>
